name: android-rust-build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Rust tests + APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK r26d
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - name: Cache Rust (rust-core)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Cache cargo-ndk install
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-ndk-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}

      # Criterio de aceptación nº 1: cargo test verde.
      - name: Run Rust tests
        working-directory: rust-core
        run: cargo test

      # Si la caché de cargo-ndk no acertó, se instala; si acertó, se salta.
      - name: Install cargo-ndk
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "== cargo-ndk cacheado, saltando instalación =="
            cargo-ndk --version
          else
            cargo install cargo-ndk --locked
          fi

      # Criterio de aceptación nº 2: el script genera los .so.
      - name: Build Rust for Android (.so)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build_rust_android.sh

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Criterio de aceptación nº 3: el proyecto Android compila.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Criterio de aceptación nº 4 (visible en el log): el APK contiene libagent_core.so.
      - name: Verify .so inside APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-universal-debug.apk
          unzip -l "$APK" | grep -E 'lib/.*libagent_core\.so'
          echo "== ABIs empaquetadas (universal) =="

      - name: List per-ABI APKs (splits)
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || true
          echo "== Splits por ABI: app-arm64-v8a-debug.apk, app-armeabi-v7a-debug.apk, app-x86_64-debug.apk =="

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error

      - name: Upload per-ABI APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-native-debug-apk-splits
          path: |
            android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
            android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Job de tests de UI Compose (instrumentados). Corren en un emulador
  # x86_64 headless con GPU swiftshader. Reusa el .so ya compilado.
  # ------------------------------------------------------------------
  ui-test:
    name: Compose UI tests (instrumented)
    needs: build
    # Solo en push a main/develop y tags; en PR se omite para no ralentizar.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK r26d
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - name: Cache Rust (rust-core)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Cache cargo-ndk install
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-ndk-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}

      - name: Install cargo-ndk (if missing)
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            cargo-ndk --version
          else
            cargo install cargo-ndk --locked
          fi

      - name: Build Rust for Android (.so)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build_rust_android.sh

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # El emulador de Android en GH Actions es inestable; usamos la acción
      # reactivecircus/android-emulator-runner que maneja KVM + boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            cd android
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-native-ui-test-results
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTest/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Job de RELEASE: solo en tags `v*`, firma el APK con keystore base64
  # guardado en GitHub Secrets. Reusa todos los pasos de build.
  # ------------------------------------------------------------------
  release:
    name: Signed release APK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK r26d
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - name: Cache Rust (rust-core)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Cache cargo-ndk install
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-ndk-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}

      - name: Install cargo-ndk (if missing)
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            cargo-ndk --version
          else
            cargo install cargo-ndk --locked
          fi

      - name: Build Rust for Android (.so)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build_rust_android.sh

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.gradle
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.gradle/agent-native.keystore
          ls -l ~/.gradle/agent-native.keystore
          # Verifica que es un keystore válido (JKS/PKCS12)
          file ~/.gradle/agent-native.keystore

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-universal-release.apk
          ls -lh "$APK"
          # Verificación de v2+ vía apksigner (lo trae el build-tools del SDK).
          # Si no está en PATH, se imprime solo el tamaño y se continúa.
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" | head -20
          else
            echo "(apksigner no disponible en PATH; verificación manual con: apksigner verify $APK)"
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-native-release-apk
          path: |
            android/app/build/outputs/apk/release/app-universal-release.apk
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-universal-release.apk
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
          generate_release_notes: true
