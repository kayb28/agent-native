name: android-rust-build

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    name: Rust tests + APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK r26d
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - name: Cache Rust (rust-core)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      # Criterio de aceptación nº 1: cargo test verde.
      - name: Run Rust tests
        working-directory: rust-core
        run: cargo test

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Criterio de aceptación nº 2: el script genera los .so.
      - name: Build Rust for Android (.so)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build_rust_android.sh

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # Criterio de aceptación nº 3: el proyecto Android compila.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Criterio de aceptación nº 4 (visible en el log): el APK contiene libagent_core.so.
      - name: Verify .so inside APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'lib/.*libagent_core\.so'
          echo "== ABIs empaquetadas =="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
